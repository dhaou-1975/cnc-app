name: Build Executable Windows 7

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Python 3.8 (Compatible Windows 7)
      uses: actions/setup-python@v5
      with:
        python-version: '3.8.10'
        architecture: 'x64'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compilation de l'exécutable
      run: |
        pyinstaller --noconsole --onefile --clean gemini-code-1786699564323.py

    - name: Publication de l'exécutable
      uses: actions/upload-artifact@v4
      with:
        name: CNC-Manager-Win7
        path: dist/gemini-code-1786699564323.exe
